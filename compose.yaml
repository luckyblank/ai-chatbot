name: ai-chatbot

services:
  mysql:
    container_name: ${COMPOSE_PROJECT_NAME:-ai-chatbot}-mysql
    image: mysql:8.0.45
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${SERVICE_MYSQL_INIT_DATABASE:-${SERVICE_DB_NAME:-ai_chatbot}}
      MYSQL_USER: ${SERVICE_DB_USERNAME:-ai_chatbot}
      MYSQL_PASSWORD: ${SERVICE_DB_PASSWORD:?Set SERVICE_DB_PASSWORD before starting the service}
      MYSQL_ROOT_PASSWORD: ${SERVICE_DB_ROOT_PASSWORD:?Set SERVICE_DB_ROOT_PASSWORD before starting the service}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${SERVICE_MYSQL_BIND_ADDRESS:-${SERVICE_BIND_ADDRESS:-127.0.0.1}}:${SERVICE_MYSQL_PORT:-13318}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    container_name: ${COMPOSE_PROJECT_NAME:-ai-chatbot}-backend
    build:
      context: ./ai-chatbot-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${SERVICE_DB_NAME:-ai_chatbot}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${SERVICE_DB_USERNAME:-ai_chatbot}
      DB_PASSWORD: ${SERVICE_DB_PASSWORD:?Set SERVICE_DB_PASSWORD before starting the service}
      DEFAULT_ADMIN_USERNAME: ${SERVICE_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${SERVICE_ADMIN_PASSWORD:?Set SERVICE_ADMIN_PASSWORD before starting the service}
      DEFAULT_ADMIN_DISPLAY_NAME: ${SERVICE_ADMIN_DISPLAY_NAME:-系统管理员}
      SPRING_PROFILES_ACTIVE: docker
      AI_ENABLED: ${SERVICE_AI_ENABLED:-false}
      AI_DASHSCOPE_API_KEY: ${SERVICE_AI_DASHSCOPE_API_KEY:-disabled-when-ai-is-off}
      AI_CALL_TIMEOUT_SECONDS: ${SERVICE_AI_CALL_TIMEOUT_SECONDS:-45}
      AI_TOOL_CALL_TIMEOUT_SECONDS: ${SERVICE_AI_TOOL_CALL_TIMEOUT_SECONDS:-120}
      WIDGET_KNOWLEDGE_BASE_ID: ${SERVICE_WIDGET_KNOWLEDGE_BASE_ID:-}
      APP_STORAGE_ROOT: /app/runtime-data
      APP_KNOWLEDGE_SEED_ROOT: /app/knowledge-seed
      CORS_ALLOWED_ORIGINS: http://localhost:${SERVICE_WEB_PORT:-15175},http://127.0.0.1:${SERVICE_WEB_PORT:-15175}
      ADMIN_ALL_BUSINESS_SCOPE: ${ADMIN_ALL_BUSINESS_SCOPE:-true}
      AUTH_COOKIE_SECURE: ${SERVICE_COOKIE_SECURE:-false}
      TZ: Asia/Shanghai
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:${SERVICE_BACKEND_PORT:-18082}:8080"
    volumes:
      - backend-runtime:/app/runtime-data
      - ./knowledge-seed:/app/knowledge-seed:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null http://127.0.0.1:8080/api/v1/auth/me"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    container_name: ${COMPOSE_PROJECT_NAME:-ai-chatbot}-web
    build:
      context: ./ai-chatbot-web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:${SERVICE_WEB_PORT:-15175}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
    name: ${SERVICE_MYSQL_VOLUME:-${COMPOSE_PROJECT_NAME:-ai-chatbot}_mysql-data}
    external: ${SERVICE_EXISTING_VOLUMES:-false}
  backend-runtime:
    name: ${SERVICE_RUNTIME_VOLUME:-${COMPOSE_PROJECT_NAME:-ai-chatbot}_backend-runtime}
    external: ${SERVICE_EXISTING_VOLUMES:-false}
