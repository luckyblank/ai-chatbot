spring:
  application:
    name: enterprise-customer-service
  ai:
    ollama:
      base-url: http://localhost:11434 # ollama服务地址， 这就是默认值
      chat:
        model: qwen3:1.7b # 模型名称
        options:
          temperature: 0.8 # 模型温度，影响模型生成结果的随机性，越小越稳定
    openai: #openai配置
      base-url: https://dashscope.aliyuncs.com/compatible-mode #api地址
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen3.8-max  #模型名称
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai-demo?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8}
    password: ${DB_PASSWORD:123456}
    username: ${DB_USERNAME:root}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
logging:
  level:
    # Keep prompts, model responses and tool arguments out of normal logs.
    org.springframework.ai: ${SPRING_AI_LOG_LEVEL:info}
    com.chatbot.ai: info # 本项目的日志级别

server:
  port: ${SERVER_PORT:8080}

app:
  ai:
    enabled: ${AI_ENABLED:true}
    call-timeout-seconds: ${AI_CALL_TIMEOUT_SECONDS:45}
  legacy:
    enabled: ${LEGACY_API_ENABLED:false}
  storage:
    root: ${APP_STORAGE_ROOT:./runtime-data}
  knowledge:
    seed-root: ${APP_KNOWLEDGE_SEED_ROOT:../knowledge-seed}
  upload:
    max-size: ${APP_UPLOAD_MAX_SIZE:104857600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    session-hours: ${AUTH_SESSION_HOURS:24}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    default-username: ${DEFAULT_ADMIN_USERNAME:admin}
    default-password: ${DEFAULT_ADMIN_PASSWORD:Admin@123456}
    default-display-name: ${DEFAULT_ADMIN_DISPLAY_NAME:系统管理员}
  workflow:
    external-timeout: ${WORKFLOW_EXTERNAL_TIMEOUT:PT30S}
  authorization:
    # Demo policy is explicit: ADMIN receives all business-subject scope. Set
    # false when scopes are provisioned solely through ai_operator_business_scope.
    admin-all-business-scope: ${ADMIN_ALL_BUSINESS_SCOPE:true}
  pending-action:
    expiry-minutes: ${PENDING_ACTION_EXPIRY_MINUTES:15}
