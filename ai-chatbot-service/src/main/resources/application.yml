spring:
  application:
    name: ai-chatbot
  profiles:
    default: dev
  ai:
    ollama:
      base-url: http://localhost:11434 # ollama服务地址， 这就是默认值
      chat:
        model: qwen3:1.7b # 模型名称
        options:
          temperature: 0.8 # 模型温度，影响模型生成结果的随机性，越小越稳定
    openai: #openai配置
      base-url: https://dashscope.aliyuncs.com/compatible-mode #api地址
      api-key: ${AI_DASHSCOPE_API_KEY:disabled-when-ai-is-off}
      chat:
        options:
          model: qwen3.8-max  #模型名称
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
logging:
  level:
    # Keep prompts, model responses and tool arguments out of normal logs.
    org.springframework.ai: ${SPRING_AI_LOG_LEVEL:info}
    com.chatbot.ai: info # 本项目的日志级别

server:
  port: ${SERVER_PORT:8080}

app:
  ai:
    call-timeout-seconds: ${AI_CALL_TIMEOUT_SECONDS:45}
  legacy:
    enabled: ${LEGACY_API_ENABLED:false}
  upload:
    max-size: ${APP_UPLOAD_MAX_SIZE:104857600}
  auth:
    session-hours: ${AUTH_SESSION_HOURS:24}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  workflow:
    external-timeout: ${WORKFLOW_EXTERNAL_TIMEOUT:PT30S}
  authorization:
    # Demo policy is explicit: ADMIN receives all business-subject scope. Set
    # false when scopes are provisioned solely through ai_operator_business_scope.
    admin-all-business-scope: ${ADMIN_ALL_BUSINESS_SCOPE:true}
  pending-action:
    expiry-minutes: ${PENDING_ACTION_EXPIRY_MINUTES:15}
